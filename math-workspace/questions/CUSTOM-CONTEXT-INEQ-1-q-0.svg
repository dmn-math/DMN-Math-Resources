<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='470' viewBox='0 0 1200 470'><rect width='1200' height='470' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='72'>A delivery van can carry at most 720 kg.</text><text class='q' x='55' y='125'>The driver and equipment have a total mass of 180 kg.</text><text class='q' x='55' y='178'>Each crate has a mass of 45 kg.</text><text class='q' x='55' y='270'>Form an inequality and find the greatest number of crates</text><text class='q' x='55' y='323'>that the van can carry.</text><text class='small' x='1040' y='410'>[3]</text></svg>