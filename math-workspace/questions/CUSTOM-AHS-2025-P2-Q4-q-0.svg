<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='470' viewBox='0 0 1200 470'><rect width='1200' height='470' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='78'>4  (a)  Express</text><text class='math' x='305' y='80'>-x² + 4x - 3</text><text class='q' x='535' y='78'>in the form</text><text class='math' x='750' y='80'>a(x + b)² + c.</text><text class='small' x='1040' y='135'>[2]</text><text class='q' x='90' y='245'>(b)  Hence, write down the coordinates of the turning point</text><text class='q' x='155' y='300'>of the graph</text><text class='math' x='360' y='302'>y = -x² + 4x - 3.</text><text class='small' x='1040' y='390'>[1]</text></svg>