<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='490' viewBox='0 0 1200 490'><rect width='1200' height='490' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='72'>Mei has $50. She buys one notebook for $8 and some pens</text><text class='q' x='55' y='125'>at $3.50 each. She wants to have at least $10 remaining.</text><text class='q' x='55' y='225'>Form an inequality and find the greatest number of pens</text><text class='q' x='55' y='278'>that Mei can buy.</text><text class='small' x='1040' y='420'>[4]</text></svg>