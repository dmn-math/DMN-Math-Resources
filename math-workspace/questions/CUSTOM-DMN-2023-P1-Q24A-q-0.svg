<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='510' viewBox='0 0 1200 510'><rect width='1200' height='510' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='72'>Jane runs a community service.</text><text class='q' x='55' y='125'>17 members are paid staff and 23 are volunteers.</text><text class='q' x='55' y='178'>Her aim is for at least 70% of the members to be volunteers.</text><text class='q' x='55' y='258'>Form an inequality and find the smallest number of volunteers</text><text class='q' x='55' y='311'>she should recruit to achieve her aim.</text><text class='small' x='1040' y='440'>[3]</text></svg>