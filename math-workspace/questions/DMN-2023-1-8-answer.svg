<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='102'><rect width='1000' height='102' fill='white'/><text x='18' y='36' font-family='Times New Roman,Times,serif' font-size='27' fill='#111827'>The vertical axis starts at 20°C rather than 0°C.</text><text x='18' y='70' font-family='Times New Roman,Times,serif' font-size='27' fill='#111827'>This exaggerates the apparent increase in temperature.</text></svg>