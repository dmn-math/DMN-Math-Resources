<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='350' viewBox='0 0 1200 350'><rect width='1200' height='350' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='82'>Solve the fractional equation.</text><g class='math'><text class='math' text-anchor='middle' x='380' y='147' font-size='34'>2x</text><line x1='297.5' y1='158' x2='462.5' y2='158' stroke='#111827' stroke-width='2.4'/><text class='math' text-anchor='middle' x='380' y='192' font-size='34'>3 − 2x</text></g><text class='math' x='495' y='175'>−</text><g class='math'><text class='math' text-anchor='middle' x='600' y='147' font-size='34'>7</text><line x1='537.5' y1='158' x2='662.5' y2='158' stroke='#111827' stroke-width='2.4'/><text class='math' text-anchor='middle' x='600' y='192' font-size='34'>x − 3</text></g><text class='math' x='700' y='175'>= 2</text><text class='small' x='1040' y='290'>[4]</text></svg>