<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='520' viewBox='0 0 1200 520'><rect width='1200' height='520' fill='white'/><style>text{font-family:'Times New Roman',Times,serif;fill:#111827}.q{font-size:31px}.math{font-family:'Times New Roman',Times,serif;font-size:34px;font-style:italic}.small{font-size:24px}.label{font-size:25px;font-weight:700}.axis{stroke:#334155;stroke-width:2}.curve{fill:none;stroke:#175cd3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bar{fill:#bfdbfe;stroke:#175cd3;stroke-width:3}</style><text class='q' x='55' y='70'>In the Singapore F1 Grand Prix, drivers must complete 62 laps</text><text class='q' x='55' y='123'>around a circuit that is 4.940 km long.</text><text class='q' x='55' y='188'>One driver completed 32 laps in 65 minutes.</text><text class='q' x='55' y='275'>What must be his minimum average speed, in km/h, for the</text><text class='q' x='55' y='328'>remaining laps if he wants to complete the race in at most 2 hours?</text><text class='small' x='1040' y='455'>[3]</text></svg>