<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='102'><rect width='1000' height='102' fill='white'/><text x='18' y='36' font-family='Times New Roman,Times,serif' font-size='27' fill='#111827'>Let x be the number recruited:  23 + x ≥ 0.70(40 + x)</text><text x='18' y='70' font-family='Times New Roman,Times,serif' font-size='27' fill='#111827'>Smallest integer x = 17 volunteers</text></svg>