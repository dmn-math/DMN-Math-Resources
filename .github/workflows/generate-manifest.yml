name: Generate paper manifests

on:
  push:
    paths:
      - "resources/**"
    branches:
      - main

# Allows this workflow to commit back to the repo
permissions:
  contents: write

jobs:
  build-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate manifests
        run: python3 scripts/generate_manifest.py

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/**/manifest.json
          git diff --staged --quiet || git commit -m "Auto-update paper manifests"
          git push
